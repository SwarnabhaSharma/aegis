{% extends "base.html" %}
{% block title %}Graph — Incident {{ incident_id[:12] }} — Aegis{% endblock %}
{% block content %}
<h2>Evidence Graph — <span class="mono">{{ incident_id[:16] }}</span></h2>

<div class="tabs">
  <a href="/incidents/{{ incident_id }}/console" class="tab">Detail</a>
  <a href="/incidents/{{ incident_id }}/privacy" class="tab">Privacy</a>
  <a href="/incidents/{{ incident_id }}/response" class="tab">Response</a>
  <a href="/incidents/{{ incident_id }}/console/graph" class="tab active">Graph</a>
</div>

<div class="card">
  <div id="graph" style="height: 600px; width: 100%; background: var(--bg); border-radius: 8px;"></div>
  <div id="graph-status" style="margin-top: 0.5rem; font-size: 0.85rem; opacity: 0.7;"></div>
</div>

<div class="card" id="node-detail" style="display: none;">
  <h3 id="node-detail-title">Node Details</h3>
  <dl class="kv" id="node-detail-kv"></dl>
  <a id="node-detail-link" href="#" class="btn" style="display: none; margin-top: 0.5rem;">View Full Record</a>
</div>

<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
(function() {
  const graphDiv = document.getElementById('graph');
  const statusDiv = document.getElementById('graph-status');
  const detailDiv = document.getElementById('node-detail');
  const detailTitle = document.getElementById('node-detail-title');
  const detailKv = document.getElementById('node-detail-kv');
  const detailLink = document.getElementById('node-detail-link');

  const NODE_COLORS = {
    evidence:   '#3498db',
    asset:      '#2ecc71',
    identity:   '#e67e22',
    indicator:  '#e74c3c',
    incident:   '#9b59b6'
  };

  const NODE_SHAPES = {
    evidence:   'dot',
    asset:      'square',
    identity:   'triangle',
    indicator:  'star',
    incident:   'diamond'
  };

  const NODE_SIZES = {
    evidence:   20,
    asset:      25,
    identity:   22,
    indicator:  18,
    incident:   30
  };

  const EDGE_LABELS = {
    BELONGS_TO_HOST:    'host',
    CONNECTED_TO:       'connects',
    WROTE_FILE:         'wrote',
    AUTHENTICATED_AS:   'auth',
    SHARED_INDICATOR:   'shared-ioc',
    PROCESS_SPAWNED:    'spawned'
  };

  fetch('/incidents/{{ incident_id }}/graph')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.nodes || data.nodes.length === 0) {
        statusDiv.textContent = 'No evidence graph for this incident yet.';
        return;
      }

      var nodes = data.nodes.map(function(n) {
        var t = n.type || 'evidence';
        var color = NODE_COLORS[t] || '#95a5a6';
        return {
          id: n.id,
          label: n.label || n.id.replace(/^(ev|asset|identity|ioc):/, ''),
          group: t,
          color: {
            background: color,
            border: color,
            highlight: { background: color, border: '#fff' },
            hover: { background: color, border: '#fff' }
          },
          shape: NODE_SHAPES[t] || 'dot',
          size: NODE_SIZES[t] || 18,
          font: { color: '#ecf0f1', size: 12 },
          title: t + ': ' + (n.label || n.id)
        };
      });

      var edges = data.edges.map(function(e) {
        return {
          from: e.src_id,
          to: e.dst_id,
          label: EDGE_LABELS[e.relationship] || e.relationship,
          color: { color: '#555', highlight: '#fff', hover: '#fff' },
          font: { color: '#999', size: 9, strokeWidth: 0 },
          arrows: 'to',
          width: 1 + (e.confidence || 0.9) * 2,
          title: e.relationship + ' (' + (e.confidence || 0.9).toFixed(2) + ')'
        };
      });

      var nodesDataSet = new vis.DataSet(nodes);
      var edgesDataSet = new vis.DataSet(edges);

      var network = new vis.Network(graphDiv, {
        nodes: nodesDataSet,
        edges: edgesDataSet
      }, {
        physics: {
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -40,
            centralGravity: 0.005,
            springLength: 150,
            springConstant: 0.08,
            damping: 0.4
          },
          stabilization: { iterations: 200 }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200,
          navigationButtons: true,
          keyboard: true
        },
        edges: {
          smooth: { type: 'continuous' }
        },
        layout: { improvedLayout: true }
      });

      network.once('stabilizationIterationsDone', function() {
        statusDiv.textContent = nodes.length + ' nodes, ' + edges.length + ' edges';
      });

      network.on('click', function(params) {
        if (params.nodes.length === 1) {
          var nodeId = params.nodes[0];
          var node = nodesDataSet.get(nodeId);
          if (!node) return;
          detailDiv.style.display = '';
          detailTitle.textContent = node.group + ': ' + node.label;
          detailKv.innerHTML = '<dt>ID</dt><dd class="mono">' + node.id + '</dd>' +
                               '<dt>Type</dt><dd>' + node.group + '</dd>';
          if (node.group === 'evidence') {
            detailLink.href = '/incidents/{{ incident_id }}/console#evidence';
            detailLink.style.display = '';
          } else {
            detailLink.style.display = 'none';
          }
        } else {
          detailDiv.style.display = 'none';
        }
      });
    })
    .catch(function(err) {
      statusDiv.textContent = 'Failed to load graph: ' + err.message;
    });
})();
</script>
{% endblock %}
